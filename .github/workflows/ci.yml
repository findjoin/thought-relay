name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install locked dependencies
        run: npm ci
      - name: Regression suite (no model credentials)
        run: npm test
      - name: Build backend and web
        env:
          # The upstream Markdown/diagram renderers exceed the runner's default 2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
